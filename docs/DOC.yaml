cs:
  perex: 'Tento dokument popisuje datový formát, používaný pro poskytování informací o aktuálním obsahu proměnného dopravního značení (VMS) podél komunikací – pevných značek a portálů i mobilních vozíků: zobrazených piktogramů, textů a doplňkových tabulek, u mobilních vozíků i aktuální polohy a konfigurace zobrazovací plochy. Statický popis značek poskytuje formát cz-ndic_d2-vms-table, na jehož tabulku se zprávy odkazují. Formát vychází z publikace VmsPublication modelu DATEX II 3.7.'
  keywords: DATEX II, NDIC, VmsPublication
en:
  perex: 'This document describes the data format used to provide information about the current content of variable message signs (VMS) along roads – fixed signs and gantries as well as mobile trailers: displayed pictograms, texts and supplementary panels, for mobile trailers also the current position and display configuration. The static description of the signs is provided by the format cz-ndic_d2-vms-table, whose table the messages reference. The format is based on the VmsPublication of the DATEX II 3.7 model.'
  keywords: DATEX II, NDIC, VmsPublication
